{% extends 'base.html' %}{% block title %}Add opportunity · IncomeGen{% endblock %}
{% block content %}<section class="heading"><div><p class="eyebrow">Manual import</p><h1>Add a sourced opportunity</h1><p>Unknown details stay unknown. Required fields are marked.</p></div></section>
<form method="post" class="card form-card"><div class="fields"><label>Platform *<select name="platform_id" required>{% for p in platforms %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select></label><label>Company *<input name="company" required></label><label class="wide">Job title *<input name="title" required></label><label class="wide">Description *<textarea name="description" rows="7" required></textarea></label><label>Required skills<input name="required_skills" placeholder="Python, SQL Server, NLP"></label><label>Preferred skills<input name="preferred_skills"></label><label>Minimum compensation<input name="compensation_min" type="number" min="0" step="0.01"></label><label>Maximum compensation<input name="compensation_max" type="number" min="0" step="0.01"></label><label>Period<select name="compensation_period"><option value="">Unknown</option><option value="hour">Hour</option><option value="year">Year</option><option value="project">Project</option></select></label><label>Currency<input name="currency" value="USD"></label><label>Remote eligibility<input name="remote_eligibility" value="Unknown"></label><label>Geographic restrictions<input name="geographic_restrictions" value="Unknown"></label><label>Contract type<input name="contract_type" value="Unknown"></label><label>Posting date<input name="posting_date" type="date"></label><label>Application deadline<input name="application_deadline" type="date"></label><label>Payment arrangements<input name="payment_arrangements" value="Unknown"></label><label class="wide">Application URL *<input name="application_url" type="url" required></label><label class="wide">Source URL *<input name="source_url" type="url" required></label><label class="wide">Application requirements<textarea name="application_requirements"></textarea></label><label class="wide">Screening or assessment requirements<textarea name="screening_requirements"></textarea></label></div><div class="form-actions"><a class="button quiet" href="{{ url_for('opportunities') }}">Cancel</a><button>Save and score</button></div></form>{% endblock %}
