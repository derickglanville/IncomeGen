{% extends 'base.html' %}{% block title %}Profile · IncomeGen{% endblock %}
{% block content %}<section class="heading"><div><p class="eyebrow">Matching inputs</p><h1>Professional profile</h1><p>Saving changes recalculates every opportunity score.</p></div></section><form method="post" class="card form-card"><div class="fields"><label>Full name<input name="full_name" value="{{ profile.full_name }}" required></label><label>Headline<input name="headline" value="{{ profile.headline }}" required></label><label class="wide">Education<textarea name="education">{{ profile.education }}</textarea></label><label class="wide">Experience<textarea name="experience">{{ profile.experience }}</textarea></label><label class="wide">Skills (comma-separated)<textarea name="skills">{{ profile.skills }}</textarea></label><label>Work location<input name="work_location" value="{{ profile.work_location }}"></label><label>Preferred arrangements<input name="contract_types" value="{{ profile.contract_types }}"></label><label>Minimum hourly rate<input type="number" min="0" step="1" name="minimum_hourly_rate" value="{{ profile.minimum_hourly_rate }}"></label><label>Preferred rate minimum<input type="number" min="0" step="1" name="preferred_hourly_rate_min" value="{{ profile.preferred_hourly_rate_min }}"></label><label>Preferred rate maximum<input type="number" min="0" step="1" name="preferred_hourly_rate_max" value="{{ profile.preferred_hourly_rate_max }}"></label><label>Weekly hours minimum<input type="number" min="0" name="weekly_hours_min" value="{{ profile.weekly_hours_min }}"></label><label>Weekly hours maximum<input type="number" min="0" name="weekly_hours_max" value="{{ profile.weekly_hours_max }}"></label><label>Monthly income goal<input type="number" min="0" step="1" name="monthly_income_goal" value="{{ profile.monthly_income_goal }}"></label></div><div class="form-actions"><button>Save profile</button></div></form>{% endblock %}
